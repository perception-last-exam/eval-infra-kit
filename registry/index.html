<title>Round 2 Data Collection</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* App shell: collapsible tinted sidebar (search, filter, scene list) | main canvas (tabs, scene detail, tables). Quiet neutrals, one cobalt accent. */
:root {
  --bg: #fbfbfc;
  --side: #eef1f5;
  --panel: #ffffff;
  --panel-2: #f1f3f6;
  --ink: #14171c;
  --ink-2: #4a525d;
  --ink-3: #7a838f;
  --line: #e4e7eb;
  --line-2: #d3d8df;
  --accent: #2f5bd3;
  --accent-soft: #e9eefc;
  --ok: #18794e;
  --ok-soft: #e2f3ea;
  --warn: #9a5a06;
  --warn-soft: #fbf0de;
  --chip: #eceff3;
  --shadow-1: 0 1px 2px rgba(20, 23, 28, .06);
  --shadow-2: 0 1px 2px rgba(20, 23, 28, .05), 0 10px 28px rgba(20, 23, 28, .10);
  --sans: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 10px;
  --r-sm: 7px;
  --side-w: 300px;
  --ease: cubic-bezier(.2, .7, .2, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1013; --side: #171b21; --panel: #15181c; --panel-2: #1c2026; --ink: #e7e9ec; --ink-2: #aab2bc; --ink-3: #7d8692;
    --line: #252a30; --line-2: #333a43; --accent: #8fb0ff; --accent-soft: #1b2640; --ok: #5cc995; --ok-soft: #13281e; --warn: #f0b467; --warn-soft: #2d2213; --chip: #232830;
    --shadow-1: 0 1px 2px rgba(0, 0, 0, .35); --shadow-2: 0 1px 2px rgba(0, 0, 0, .35), 0 12px 30px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1013; --side: #171b21; --panel: #15181c; --panel-2: #1c2026; --ink: #e7e9ec; --ink-2: #aab2bc; --ink-3: #7d8692;
  --line: #252a30; --line-2: #333a43; --accent: #8fb0ff; --accent-soft: #1b2640; --ok: #5cc995; --ok-soft: #13281e; --warn: #f0b467; --warn-soft: #2d2213; --chip: #232830;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .35); --shadow-2: 0 1px 2px rgba(0, 0, 0, .35), 0 12px 30px rgba(0, 0, 0, .45);
  color-scheme: dark;
}
html { -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--mono); font-size: .9em; letter-spacing: -.01em; }
.num { font-variant-numeric: tabular-nums; }
.faint { color: var(--ink-3); }
svg.i { width: 15px; height: 15px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; transition: grid-template-columns .26s var(--ease); }
.app.collapsed { grid-template-columns: 0px minmax(0, 1fr); }
.side { position: sticky; top: 0; height: 100vh; height: 100dvh; overflow: hidden; background: var(--side); border-right: 1px solid var(--line-2); z-index: 7; }
.side-in { width: var(--side-w); height: 100%; display: flex; flex-direction: column; padding-top: max(14px, env(safe-area-inset-top, 0px)); padding-bottom: max(10px, env(safe-area-inset-bottom, 0px)); padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: 14px; box-sizing: border-box; transition: opacity .2s var(--ease); }
.app.collapsed .side-in { opacity: 0; pointer-events: none; }
.app.collapsed .side { border-right-color: transparent; }
.side-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 2px 14px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mark { width: 28px; height: 28px; border-radius: 7px; background: var(--ink); color: var(--panel); display: grid; place-items: center; font-family: var(--mono); font-size: 10.5px; font-weight: 500; flex: none; }
.brand .b1 { font-weight: 600; font-size: 14.5px; letter-spacing: -.01em; line-height: 1.2; }
.brand .b2 { color: var(--ink-3); font-size: 12px; line-height: 1.2; }
.side-tools { display: flex; flex-direction: column; gap: 8px; padding-bottom: 14px; border-bottom: 1px solid var(--line-2); }
.search { position: relative; display: flex; align-items: center; }
.search svg { position: absolute; left: 9px; color: var(--ink-3); pointer-events: none; }
.search input { width: 100%; padding: 7px 32px 7px 30px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--panel); transition: border-color .15s, box-shadow .15s; }
.search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search kbd { position: absolute; right: 8px; font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); border: 1px solid var(--line-2); border-radius: 4px; padding: 0 5px; background: var(--panel-2); }
.sel { width: 100%; padding: 7px 28px 7px 10px; border: 1px solid var(--line-2); border-radius: 8px; background-color: var(--panel); -webkit-appearance: none; appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position: calc(100% - 14px) 52%, calc(100% - 10px) 52%; background-size: 4px 4px; background-repeat: no-repeat; }
.side-label { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 4px 6px; font-size: 11.5px; font-weight: 500; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); }
.rail { flex: 1 1 auto; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; margin: 0 -6px; padding: 2px 6px 8px; scrollbar-width: thin; }
.item { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 11px; align-items: center; padding: 6px 8px 6px 6px; border-radius: var(--r-sm); cursor: pointer; border: 1px solid transparent; background: transparent; text-align: left; width: 100%; transition: background .15s var(--ease), border-color .15s var(--ease); }
.item:hover { background: color-mix(in srgb, var(--panel) 65%, transparent); }
.item[aria-selected="true"] { background: var(--panel); border-color: var(--line-2); box-shadow: var(--shadow-1); }
.item[aria-selected="true"] .item-id { color: var(--accent); }
.item .th, .item .th-ph { width: 46px; height: 46px; border-radius: 6px; object-fit: cover; background: var(--panel-2); display: block; }
.item-id { display: block; font-family: var(--mono); font-size: 12.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-meta { font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 5px; }
.item-meta svg.i { width: 12px; height: 12px; }
.rail-empty { padding: 14px 6px; color: var(--ink-3); font-size: 13px; }
.side-foot { border-top: 1px solid var(--line-2); padding: 10px 4px 2px; font-size: 11.5px; color: var(--ink-3); }
.scrim { position: fixed; inset: 0; background: rgba(8, 10, 13, .38); z-index: 6; }

.main { min-width: 0; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.app:not(.collapsed) .main { padding-left: 28px; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding-block: 14px 12px; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--panel-2); border-radius: 9px; border: 1px solid var(--line); }
.seg a { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 7px; color: var(--ink-2); font-weight: 500; font-size: 13px; white-space: nowrap; text-decoration: none; transition: background .15s var(--ease), color .15s var(--ease); }
.seg a:hover { color: var(--ink); }
.seg a[aria-current="page"] { background: var(--panel); color: var(--ink); box-shadow: var(--shadow-1); }
.seg .ct { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
.top .push { margin-left: auto; }
.top-actions { display: flex; align-items: center; gap: 8px; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); cursor: pointer; font-size: 13px; font-weight: 500; color: var(--ink); transition: background .15s, border-color .15s; white-space: nowrap; }
.btn:hover { background: var(--panel-2); border-color: var(--line-2); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: color-mix(in srgb, var(--panel-2) 80%, transparent); }
.btn.icon { padding: 6px; }
.menu { position: relative; }
.menu > summary { list-style: none; }
.menu > summary::-webkit-details-marker { display: none; }
.menu .pop { position: absolute; right: 0; top: calc(100% + 6px); min-width: 220px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-sm); box-shadow: var(--shadow-2); padding: 4px; z-index: 8; display: flex; flex-direction: column; }
.menu .pop button { text-align: left; padding: 8px 10px; border: 0; background: transparent; border-radius: 5px; cursor: pointer; font-size: 13px; }
.menu .pop button:hover { background: var(--panel-2); }
.menu .pop .hint { font-size: 11.5px; color: var(--ink-3); display: block; }
.banner { display: flex; flex-wrap: wrap; gap: 4px 10px; padding: 7px 12px; margin-bottom: 14px; border-radius: var(--r-sm); background: var(--panel); border: 1px dashed var(--line-2); color: var(--ink-2); font-size: 12.5px; }
.banner b { color: var(--ink); font-weight: 600; }
.content { padding-bottom: 48px; max-width: 1240px; }

@media (max-width: 900px) {
  .app, .app.collapsed { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; left: 0; top: 0; bottom: 0; width: min(var(--side-w), 86vw); transform: translateX(-102%); transition: transform .26s var(--ease); box-shadow: var(--shadow-2); }
  .side-in { width: 100%; }
  .app.collapsed .side-in { opacity: 1; pointer-events: auto; }
  .app.drawer .side { transform: none; }
  .app:not(.collapsed) .main, .main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}

/* ---------- scene detail ---------- */
.detail { min-width: 0; display: flex; flex-direction: column; gap: 20px; }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .2s; animation-timing-function: var(--ease); }
.side { view-transition-name: side; }
.detail.enter { animation: rise .22s var(--ease); }
@keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.d-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 16px; }
.d-title { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.d-title h2 { margin: 0; font-family: var(--mono); font-size: 22px; font-weight: 500; letter-spacing: -.025em; overflow-wrap: anywhere; }
.d-meta { color: var(--ink-2); font-size: 13px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.d-meta .sep { color: var(--line-2); }
.d-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; background: var(--chip); color: var(--ink-2); font-size: 12px; font-weight: 500; white-space: nowrap; }
.tag.accent { background: var(--accent-soft); color: var(--accent); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow-1); }

/* Video works at any aspect ratio: tall and square clips sit beside the facts, wide clips span the card. */
.hero { display: grid; grid-template-columns: auto minmax(0, 1fr); overflow: hidden; }
.hero.wide { grid-template-columns: minmax(0, 1fr); }
.media { background: #0b0c0e; display: flex; flex-direction: column; align-items: center; min-width: 0; max-width: 100%; }
.media video, .media img { display: block; background: #0b0c0e; object-fit: contain; max-width: 100%; }
.hero:not(.wide) .media video, .hero:not(.wide) .media img { height: min(64vh, 640px); width: auto; }
.hero.square .media video, .hero.square .media img { height: min(48vh, 440px); }
.hero.wide .media { align-items: stretch; }
.hero.wide .media video, .hero.wide .media img { width: 100%; height: auto; max-height: 62vh; }
.fbar { align-self: stretch; display: flex; align-items: center; gap: 4px; padding: 8px 10px; background: #111317; color: #c9ced6; font-family: var(--mono); font-size: 12px; }
.fbar button { display: inline-grid; place-items: center; width: 28px; height: 26px; border-radius: 6px; border: 1px solid #2a2f36; background: #181b20; color: #e6e8eb; cursor: pointer; }
.fbar button:hover { background: #22262c; }
.fbar .fr { margin-left: 6px; color: #fff; white-space: nowrap; }
.fbar .ft { margin-left: auto; color: #8d95a0; white-space: nowrap; padding-left: 8px; }
.no-media { width: 100%; min-height: 220px; display: grid; place-items: center; color: #8d95a0; font-size: 13px; padding: 20px; }
@media (max-width: 760px) {
  .hero, .hero.wide { grid-template-columns: minmax(0, 1fr); }
  .hero .media { align-items: stretch; }
  .hero:not(.wide) .media video, .hero:not(.wide) .media img, .hero.square .media video { width: 100%; height: auto; max-height: 60vh; }
}
.facts { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.fgrid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; margin: 0; }
.fgrid div { min-width: 0; }
.fgrid dt { font-size: 11.5px; font-weight: 500; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 2px; }
.fgrid dd { margin: 0; font-size: 14.5px; line-height: 1.5; overflow-wrap: anywhere; }
.disc { border-top: 1px solid var(--line); padding-top: 10px; }
.disc > summary { cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 13px; font-weight: 500; }
.disc > summary::-webkit-details-marker { display: none; }
.disc > summary svg { transition: transform .2s var(--ease); }
.disc[open] > summary svg { transform: rotate(90deg); }
.kv { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
.kv th { text-align: left; vertical-align: top; font-family: var(--mono); font-weight: 400; font-size: 12px; color: var(--ink-3); padding: 5px 16px 5px 0; width: 1%; white-space: nowrap; }
.kv td { padding: 5px 0; vertical-align: top; overflow-wrap: anywhere; }
.kv tr + tr > * { border-top: 1px solid var(--line); }
pre { margin: 10px 0 0; padding: 12px; border-radius: var(--r-sm); background: var(--panel-2); overflow: auto; max-height: 420px; font-family: var(--mono); font-size: 12px; line-height: 1.45; }

/* ---------- queries: one card per query; the three core fields always visible ---------- */
.sec-head { display: flex; align-items: baseline; gap: 8px; margin: 8px 0 10px; }
.sec-head h3 { margin: 0; font-size: 14px; font-weight: 600; }
.qlist { display: flex; flex-direction: column; gap: 12px; container-type: inline-size; }
.qc { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow-1); transition: border-color .2s var(--ease), box-shadow .3s var(--ease); }
.qc:hover { border-color: var(--line-2); }
.qc.open { border-color: var(--line-2); box-shadow: var(--shadow-2); }
.qc-main { padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
.qc-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 28px; align-items: start; }
.qc-kicker { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; font-size: 12px; color: var(--ink-3); }
.qc-n { font-family: var(--mono); font-weight: 500; color: var(--accent); }
.qc-def { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.4; letter-spacing: -.005em; }
.qc-def::first-letter, .core .link dd::first-letter, .cap::first-letter { text-transform: uppercase; }
.cap { display: block; }
.qc-sub { margin-top: 4px; font-size: 13px; color: var(--ink-2); }
.qc-gt { text-align: right; white-space: nowrap; }
.qc-gt .lab { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
.qc-gt .v { font-family: var(--mono); font-size: 20px; font-weight: 500; letter-spacing: -.03em; line-height: 1.3; }
.qc-gt .u { font-family: var(--sans); font-size: 12.5px; letter-spacing: 0; color: var(--ink-3); }
.core { margin: 0; display: grid; grid-template-columns: minmax(0, .85fr) minmax(0, 1.2fr) minmax(0, 2fr); gap: 14px 26px; padding: 13px 15px; border-radius: var(--r-sm); background: var(--panel-2); }
.core > div { min-width: 0; }
.core dt { margin-bottom: 6px; font-size: 11px; font-weight: 500; line-height: 1.35; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
.core dd { margin: 0; font-size: 13.5px; line-height: 1.5; overflow-wrap: anywhere; }
.miss { color: var(--warn); }
.dom { display: inline-flex; align-items: center; gap: 7px; font-weight: 500; }
.dom::before { content: ""; width: 7px; height: 7px; border-radius: 2px; background: var(--accent); flex: none; }
.pills { display: flex; flex-wrap: wrap; gap: 5px; }
.pill { display: inline-flex; align-items: center; padding: 0 9px; border: 1px solid var(--line-2); border-radius: 999px; background: var(--panel); font-size: 12.5px; line-height: 1.7; white-space: nowrap; }
@container (max-width: 700px) {
  .core { grid-template-columns: minmax(0, 1fr); }
  .qc-head { grid-template-columns: minmax(0, 1fr); }
  .qc-gt { text-align: left; }
}
.qc-more { display: flex; align-items: center; gap: 8px; width: 100%; padding: 10px 18px; border: 0; border-top: 1px solid var(--line); border-radius: 0 0 var(--r) var(--r); background: transparent; color: var(--ink-2); font-size: 13px; font-weight: 500; text-align: left; cursor: pointer; transition: background .15s var(--ease), color .15s var(--ease); }
.qc-more:hover { background: color-mix(in srgb, var(--panel-2) 60%, transparent); color: var(--ink); }
.qc.open .qc-more { border-radius: 0; }
.qc-more .runs { margin-left: auto; font-size: 12.5px; font-weight: 400; color: var(--ink-3); white-space: nowrap; }
.qc-more .runs b { font-weight: 500; color: var(--ink); }
.chev { color: var(--ink-3); transition: transform .22s var(--ease); }
.qc.open .chev { transform: rotate(90deg); }
.q-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s var(--ease); }
.qc.open .q-body { grid-template-rows: 1fr; }
.q-body > div { overflow: hidden; }
.q-inner { padding: 6px 18px 18px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px 28px; opacity: 0; transition: opacity .2s var(--ease); }
.qc.open .q-inner { opacity: 1; transition-delay: .06s; }
@container (max-width: 860px) { .q-inner { grid-template-columns: minmax(0, 1fr); } }
.q-inner h4 { margin: 0 0 6px; font-size: 11px; font-weight: 500; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.runs-wrap { overflow-x: auto; }
.runs-tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.runs-tbl th { text-align: left; font-weight: 500; color: var(--ink-3); font-size: 11.5px; padding: 4px 10px 4px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
.runs-tbl td { padding: 5px 10px 5px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
.runs-tbl tr:last-child td { border-bottom: 0; }
.hit { color: var(--ok); font-weight: 500; }
.strip { display: block; max-width: 100%; height: auto; margin: 2px 0 10px; }

/* ---------- flat tables ---------- */
.tbl-card { overflow: hidden; }
.tbl-scroll { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-size: 11.5px; font-weight: 500; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--panel); }
.tbl th button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.tbl th button:hover { color: var(--ink); }
.tbl th button:focus-visible { outline: 2px solid var(--accent); border-radius: 3px; }
.tbl th .arr { font-size: 10px; color: var(--accent); }
.tbl td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr.click { cursor: pointer; transition: background .12s; }
.tbl tbody tr.click:hover td { background: color-mix(in srgb, var(--panel-2) 60%, transparent); }
.tbl .wide { min-width: 240px; max-width: 420px; }
.tbl th.wrap { white-space: normal; min-width: 220px; line-height: 1.35; }
#q-table th, #q-table td { padding-left: 12px; padding-right: 12px; }
#q-table td.wide, #q-table th.wrap { min-width: 150px; }
#q-table td.chal { min-width: 140px; }
.tbl .qdef { margin-top: 3px; font-weight: 500; }
.tbl .s { color: var(--ink-3); font-size: 12px; margin-top: 2px; }
.empty { padding: 28px 18px; color: var(--ink-3); text-align: center; }
.skel { height: 52px; border-radius: var(--r-sm); background: linear-gradient(90deg, var(--panel-2), var(--panel), var(--panel-2)); background-size: 200% 100%; animation: sh 1.2s linear infinite; }
@keyframes sh { from { background-position: 200% 0; } to { background-position: -200% 0; } }
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.btn.primary:hover { background: var(--accent); border-color: var(--accent); filter: brightness(1.08); }
.btn[disabled] { opacity: .55; cursor: default; pointer-events: none; }
.seg .ct.new { color: var(--accent); font-weight: 500; }
.fbar a { color: #a9c0ff; }

/* ---------- Google Drive check ---------- */
.dv { display: flex; flex-direction: column; gap: 18px; }
.dv-head { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.dv-top { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 10px 16px; }
.dv-top h3 { margin: 0; font-size: 15px; font-weight: 600; }
.dv-sub { color: var(--ink-3); font-size: 12.5px; margin-top: 2px; }
.dv-msg { font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.dv-msg.err { color: var(--warn); }
.dlist { overflow: hidden; }
.drow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; align-items: center; padding: 12px 16px; }
.drow + .drow { border-top: 1px solid var(--line); }
.drow-top { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-weight: 500; overflow-wrap: anywhere; }
.drow-meta { font-size: 12.5px; color: var(--ink-2); margin-top: 3px; overflow-wrap: anywhere; }
.drow-note { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; max-width: 80ch; }
.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(18px, env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--panel); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 30; box-shadow: var(--shadow-2); max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";
const THRESH = 0.10;
const KNOWN_SCENE = new Set(["schema", "demo", "scene_id", "collector", "status", "environment", "summary", "scope", "dynamic", "input_video", "device", "resolution", "fps", "duration_s", "n_frames", "calibration_video", "evidence_dir", "queries", "notes", "drive", "thumb_asset", "video_asset", "synced_at"]);
const KNOWN_Q = new Set(["query_id", "metric_domain", "kind", "point_a", "point_b", "point_c", "object", "definition", "moment", "frame_index", "gt_value", "gt_unit", "gt_uncertainty", "how_measured", "evidence", "challenges", "robotics_link", "why_hard", "pilot", "results", "notes"]);
const LABEL = {
  rigid_distance: "Rigid distance", deformable_distance: "Deformable distance", liquid_volume: "Liquid volume", object_weight: "Object weight", robot_state: "Robot state",
  temperature: "Temperature", material_composition: "Material composition", image_frame: "Image frame", camera: "Camera",
  height_above: "height above", path_length: "path length", px_distance: "pixel distance", px_area: "pixel area", focal_length: "focal length",
  occlusion: "Occlusion", clutter_stacking: "Clutter / stacking", fast_or_shaky_camera: "Fast or shaky camera", low_light: "Low light", zoom_or_lens: "Zoom / lens change",
  reflection_mirror: "Reflection / mirror", transparency: "Transparency", dynamic_scene: "Dynamic scene", imagined_state: "Imagined state", long_context: "Long context",
  physical_gap: "Physical gap", fit_affordance: "Fit / affordance", deformable: "Deformable", small_or_thin: "Small or thin", irregular_shape: "Irregular shape",
  color: "Color", other: "Other",
};
const lab = (k) => LABEL[k] || String(k ?? "").replace(/_/g, " ");
const MISS = '<span class="miss">Not set</span>';

// ---------- helpers ----------
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const isNum = (v) => typeof v === "number" && Number.isFinite(v);
const icon = (n, cls = "") => `<svg class="i${cls ? " " + cls : ""}"><use href="#i-${n}"/></svg>`;
const blank = (v) => v === null || v === undefined || v === "" || (Array.isArray(v) && !v.length);
const DASH = '<span class="faint">—</span>';
const val = (v) => (blank(v) ? DASH : esc(Array.isArray(v) ? v.join(", ") : typeof v === "object" ? JSON.stringify(v) : v));
const fmt = (v) => {
  if (!isNum(v)) return "—";
  const a = Math.abs(v);
  if (a >= 10000) return Math.round(v).toLocaleString("en-US");
  if (a >= 100) return String(Math.round(v * 10) / 10);
  if (a >= 1) return String(Math.round(v * 100) / 100);
  return String(Math.round(v * 1000) / 1000);
};
const sPct = (x) => (isNum(x) ? (x > 0 ? "+" : x < 0 ? "−" : "±") + Math.abs(x * 100).toFixed(1) + "%" : "—");
const relErr = (p, g) => (isNum(p) && isNum(g) && g !== 0 ? (p - g) / Math.abs(g) : null);
const extrasOf = (o, known) => Object.entries(o || {}).filter(([k]) => !known.has(k));
const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const mobile = () => matchMedia("(max-width: 900px)").matches;
const lsGet = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch { /* storage unavailable */ } };
let tt = 0;
function toast(m) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => (t.hidden = true), 2400); }
function runStats(q) {
  const errs = (q.results || []).map((r) => relErr(r.predicted, q.gt_value)).filter((e) => e !== null);
  return { n: errs.length, within: errs.filter((e) => Math.abs(e) <= THRESH + 1e-12).length, best: errs.length ? errs.reduce((b, e) => (Math.abs(e) < Math.abs(b) ? e : b)) : null };
}
function targets(q) {
  const p = [];
  if (q.point_a) p.push(`<b class="faint">A</b> ${esc(q.point_a)}`);
  if (q.point_b) p.push(`<b class="faint">B</b> ${esc(q.point_b)}`);
  if (q.point_c) p.push(`<b class="faint">C</b> ${esc(q.point_c)}`);
  if (q.object) p.push(esc(q.object));
  if (q.moment) p.push(`at ${esc(q.moment)}`);
  if (Number.isInteger(q.frame_index)) p.push(`frame ${q.frame_index}`);
  return p.join('<span class="faint"> · </span>');
}
// Shape of a scene's video: from its recorded resolution first, then the real video once it loads.
function shapeOf(w, h) { if (!(w > 0 && h > 0)) return "tall"; const r = w / h; return r > 1.15 ? "wide" : r < 0.87 ? "tall" : "square"; }

// ---------- state ----------
const DOCID = new WeakMap(); // scene object -> its database document id
const state = { scenes: [], meta: null, loaded: false, db: "connecting", err: "", view: "scenes", sel: null, openQs: new Set(), scrollQ: null, detailSig: null, pendingSeek: null, sort: { key: "query_id", dir: 1 } };
const allQueries = () => state.scenes.flatMap((s) => (s.queries || []).map((q, i) => ({ s, q, id: q.query_id || `${s.scene_id}-q${i + 1}` })));
function filters() {
  const term = $("#f-term").value.trim().toLowerCase(), c = $("#f-collector").value;
  return {
    scenes: state.scenes.filter((s) => (!c || s.collector === c) && (!term || JSON.stringify(s).toLowerCase().includes(term))),
    queries: allQueries().filter((x) => (!c || x.s.collector === c) && (!term || (x.id + " " + x.s.scene_id + " " + JSON.stringify(x.q)).toLowerCase().includes(term))),
  };
}

// ---------- sidebar ----------
const app = $("#app");
let collapsed = lsGet("r2s-side") === "closed";
function applySide() {
  const m = mobile();
  app.classList.toggle("collapsed", !m && collapsed);
  $("#side-open").hidden = !(m || collapsed);
  $("#scrim").hidden = !(m && app.classList.contains("drawer"));
  $("#side-close").setAttribute("aria-label", m ? "Close scene list" : "Hide sidebar");
}
function openSide() { if (mobile()) app.classList.add("drawer"); else { collapsed = false; lsSet("r2s-side", "open"); } applySide(); if (!mobile()) setTimeout(() => $("#f-term").focus({ preventScroll: true }), 120); }
function closeSide() { if (mobile()) app.classList.remove("drawer"); else { collapsed = true; lsSet("r2s-side", "closed"); } applySide(); }

function renderChrome() {
  const qs = allQueries();
  $("#ct-scenes").textContent = "";
  $("#ct-queries").textContent = state.loaded ? qs.length : "";
  const cols = [...new Set(state.scenes.map((s) => s.collector).filter(Boolean))].sort();
  const sel = $("#f-collector"), cur = sel.value;
  sel.innerHTML = '<option value="">All collectors</option>' + cols.map((c) => `<option${c === cur ? " selected" : ""}>${esc(c)}</option>`).join("");
  const R = driveView(), nNew = R && R.counts ? (R.counts.new || 0) + (R.counts.changed || 0) : 0;
  $("#ct-drive").textContent = nNew ? `${nNew} new` : "";
  $("#ct-drive").classList.toggle("new", nNew > 0);
  $("#check-drive").disabled = drive.busy;
  $("#check-drive").hidden = !drive.mcp || state.view === "drive";
  $("#side-foot").textContent = state.db === "absent" ? "Not signed in" : !state.loaded ? "Loading…" : `${state.scenes.length} scenes · ${qs.length} queries · ${cols.length} collectors` + (R && R.checked_at ? ` · Drive checked ${ago(R.checked_at)}` : " · Drive not checked yet");
  const b = $("#banner"), parts = [];
  if (state.db === "absent") parts.push("<b>Sign in to claude.ai</b> to see the data.");
  if (state.err) parts.push(esc(state.err));
  b.innerHTML = parts.join(" "); b.hidden = !parts.length;
}
function renderRail() {
  const rail = $("#rail");
  if (!state.loaded) { rail.innerHTML = state.db === "absent" ? '<div class="rail-empty">Sign in to claude.ai to see the scenes.</div>' : '<div class="skel"></div><div class="skel"></div><div class="skel"></div>'; $("#ct-side").textContent = ""; return; }
  const { scenes } = filters();
  $("#ct-side").textContent = scenes.length === state.scenes.length ? String(scenes.length) : `${scenes.length} of ${state.scenes.length}`;
  if (!state.scenes.length) { rail.innerHTML = '<div class="rail-empty">No scenes yet.</div>'; return; }
  rail.innerHTML = scenes.map((s) => `<button class="item" type="button" data-sid="${esc(s.scene_id)}" aria-selected="${s.scene_id === state.sel}" aria-current="${s.scene_id === state.sel ? "true" : "false"}">
      ${s.thumb_asset ? `<img class="th" src="/_blob/${encodeURIComponent(s.thumb_asset)}" alt="" loading="lazy">` : '<span class="th-ph"></span>'}
      <span style="min-width:0"><span class="item-id">${esc(s.scene_id)}</span>
      <span class="item-meta">${esc(s.collector || "—")}<span>·</span>${plural((s.queries || []).length, "query", "queries")}${s.video_asset ? `<span>·</span>${icon("video")}` : ""}</span></span></button>`).join("")
    || '<div class="rail-empty">No scenes match your search.</div>';
}

// ---------- scene detail ----------
function strip(q) {
  const res = (q.results || []).map((r) => ({ r, e: relErr(r.predicted, q.gt_value) })).filter((x) => x.e !== null);
  if (!res.length) return "";
  const W = 260, pad = 10, span = 0.5, x = (e) => pad + ((Math.max(-span, Math.min(span, e)) + span) / (2 * span)) * (W - 2 * pad);
  const dots = res.map(({ r, e }) => {
    const gpt = String(r.model).startsWith("gpt"), cx = x(e);
    return `<g><title>${esc(r.model)} attempt ${esc(r.attempt ?? "")}: ${sPct(e)}</title>${gpt ? `<circle cx="${cx.toFixed(1)}" cy="13" r="4.2" fill="var(--ink)"/>` : `<rect x="${(cx - 4).toFixed(1)}" y="9" width="8" height="8" rx="1.5" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.6"/>`}</g>`;
  }).join("");
  const ticks = [-0.5, -0.1, 0, 0.1, 0.5].map((t) => `<text x="${x(t).toFixed(1)}" y="36" font-size="9.5" text-anchor="middle" fill="var(--ink-3)" font-family="Geist Mono, monospace">${t === 0 ? "0" : (t > 0 ? "+" : "−") + Math.abs(t * 100) + "%"}</text>`).join("");
  return `<svg class="strip" width="${W}" height="40" viewBox="0 0 ${W} 40" role="img" aria-label="Relative error of each model attempt; the shaded band is within 10 percent">
    <rect x="${x(-THRESH).toFixed(1)}" y="3" width="${(x(THRESH) - x(-THRESH)).toFixed(1)}" height="20" rx="3" fill="var(--ok-soft)"/>
    <line x1="${pad}" y1="23" x2="${W - pad}" y2="23" stroke="var(--line-2)"/><line x1="${x(0)}" y1="3" x2="${x(0)}" y2="23" stroke="var(--ink-3)" stroke-dasharray="2 3"/>${ticks}${dots}</svg>`;
}
// The three core fields, labelled exactly as in the collection sheet; a missing one says so.
function coreFields(q) {
  const ch = q.challenges || [];
  return `<dl class="core">
    <div><dt>Metric domain</dt><dd>${q.metric_domain ? `<span class="dom">${esc(lab(q.metric_domain))}</span>` : MISS}</dd></div>
    <div><dt>Associated challenges</dt><dd>${ch.length ? `<div class="pills">${ch.map((c) => `<span class="pill">${esc(lab(c))}</span>`).join("")}</div>` : MISS}</dd></div>
    <div class="link"><dt>Connection to real-world application / robotics failure mode</dt><dd>${q.robotics_link ? esc(q.robotics_link) : MISS}</dd></div>
  </dl>`;
}
function queryItem(s, q, i) {
  const id = q.query_id || `${s.scene_id}-q${i + 1}`, open = state.openQs.has(id), st = runStats(q);
  const n = (String(id).match(/q(\d+)$/i) || [])[1] || String(i + 1);
  const unit = esc(q.gt_unit || "");
  const gt = isNum(q.gt_value) ? `<div class="v">${fmt(q.gt_value)} <span class="u">${unit}</span></div>${isNum(q.gt_uncertainty) ? `<div class="u">± ${fmt(q.gt_uncertainty)} ${unit}</div>` : ""}` : '<div class="u miss">No value yet</div>';
  const runs = st.n ? `<span class="runs"><b>${st.within} of ${st.n}</b> runs within 10%</span>` : '<span class="runs">Not run yet</span>';
  const res = q.results || [];
  const details = [["how measured", q.how_measured, true], ["kind", q.kind ? lab(q.kind) : null, true], ["why it should be hard", q.why_hard],
    ["evidence", (q.evidence || []).join(", ") || null], ["notes", q.notes], ...extrasOf(q, KNOWN_Q).map(([k, v]) => [k, v])]
    .filter(([, v, always]) => always || !blank(v));
  return `<article class="qc${open ? " open" : ""}" data-qid="${esc(id)}">
    <div class="qc-main">
      <div class="qc-head">
        <div style="min-width:0">
          <div class="qc-kicker"><span class="qc-n">Q${esc(n)}</span><span class="mono">${esc(id)}</span></div>
          <h4 class="qc-def">${esc(q.definition || "(no definition)")}</h4>
          ${targets(q) ? `<div class="qc-sub">${targets(q)}</div>` : ""}
        </div>
        <div class="qc-gt"><div class="lab">Ground truth</div>${gt}</div>
      </div>
      ${coreFields(q)}
    </div>
    <button class="qc-more" type="button" aria-expanded="${open}">${icon("chev", "chev")}Measurement and model runs${runs}</button>
    <div class="q-body"><div><div class="q-inner">
      <div><h4>Measurement</h4><table class="kv" style="margin-top:0"><tbody>${details.map(([k, v]) => `<tr><th>${esc(k)}</th><td>${val(v)}</td></tr>`).join("")}</tbody></table></div>
      <div><h4>Model runs</h4>${res.length ? `${strip(q)}<div class="runs-wrap"><table class="runs-tbl"><thead><tr><th>Model</th><th>Try</th><th>Predicted</th><th>Error</th><th></th></tr></thead><tbody>${res.map((r) => {
          const e = relErr(r.predicted, q.gt_value), hit = e !== null && Math.abs(e) <= THRESH + 1e-12;
          return `<tr><td><span class="mono">${esc(r.model)}</span> <span class="faint">${esc(r.harness || "")}${r.effort ? " · " + esc(r.effort) : ""}</span></td><td class="num">${esc(r.attempt ?? "")}</td><td class="mono num">${fmt(r.predicted)}</td><td class="mono num">${sPct(e)}</td><td>${hit ? '<span class="hit">within 10%</span>' : '<span class="faint">missed</span>'}</td></tr>`;
        }).join("")}</tbody></table></div><div class="faint" style="font-size:11.5px;margin-top:6px">● GPT-6.1 Sol &nbsp; ▢ Opus 5.5 &nbsp; shaded band: within 10%</div>` : '<div class="faint">No model runs yet.</div>'}
        ${Number.isInteger(q.frame_index) && s.video_asset ? `<div style="margin-top:12px"><button class="btn" type="button" data-seek="${q.frame_index}">${icon("frame")}Show frame ${q.frame_index}</button></div>` : ""}
      </div>
    </div></div></div></article>`;
}
function renderQueriesInto(s) {
  const el = $("#d-queries"); if (!el) return;
  const qs = s.queries || [];
  el.innerHTML = qs.length ? qs.map((q, i) => queryItem(s, q, i)).join("") : '<div class="card empty">No queries for this scene yet.</div>';
}
function renderDetail() {
  const el = $("#detail");
  if (!state.loaded) { el.innerHTML = state.db === "absent" ? "" : '<div class="skel" style="height:420px"></div>'; return; }

  drive.canEdit = !!(u && (await u.canEdit().catch(() => false)));
  render();
})();
})();
</script>
